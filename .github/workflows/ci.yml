name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install Poppler HTML oracle
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          pdftohtml -v
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
